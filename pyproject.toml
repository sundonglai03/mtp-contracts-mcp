[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-contracts-mcp"
version = "0.1.0"
description = "测试用例规范系统：把 contracts-core 暴露为 Streamable HTTP MCP 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mtp-contracts==0.1.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[project.scripts]
mtp-contracts-mcp = "mtp_contracts_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
