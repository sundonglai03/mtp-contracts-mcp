[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-contracts-mcp"
version = "0.1.0"
description = "测试用例规范系统：把 contracts-core 暴露为 Streamable HTTP MCP 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mtp-contracts-core==0.1.0",
    "PyYAML>=6.0",
    # mcp 2.x：FastMCP 已改名 MCPServer（mcp.server.mcpserver）
    "mcp>=2.0",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "anyio>=4.0", "httpx2>=2.5"]

[project.scripts]
mtp-contracts-mcp = "mtp_contracts_mcp.server:main"

[tool.uv.sources]
mtp-contracts-core = { git = "https://github.com/sundonglai03/mtp-contracts-core.git", tag = "v0.1.0" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
