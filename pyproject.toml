[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mtp-contracts-mcp"
version = "0.1.0"
description = "测试用例规范系统：把 contracts-core 暴露为 Streamable HTTP MCP 服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.20",
    # mcp 2.x：FastMCP 已改名 MCPServer（mcp.server.mcpserver）
    "mcp>=2.0",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "anyio>=4.0", "httpx2>=2.5"]

[project.scripts]
mtp-contracts-mcp = "mtp_contracts_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mtp_contracts_mcp.contracts" = ["case_schema.json", "_sync_manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
